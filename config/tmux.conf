# >>> workdeck >>>
# Prefix: Ctrl+b (the default).

set -g mouse on

# Windows and panes start at 1, to match the number keys
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Modern colors and keys
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",wezterm:RGB"
set -g extended-keys on
set -sg escape-time 10
set -g focus-events on

# Large history for scrolling through test and agent output
set -g history-limit 50000

# ---- keys without prefix ---------------------------------------------------
# They work in any terminal and on any system, because tmux interprets them,
# not the terminal.
#
# Alt+number and Alt+Up/Down are safe. Alt+lowercase letter is NOT: readline
# uses Alt+b, Alt+f, Alt+d and others to move and delete words in the shell,
# and a binding here would steal those keys. That is why actions use Alt+Shift.
# Alt+Left and Alt+Right are not bound either, because shells and agents use
# them to move by word.

# Clearing the prefix table does not touch the root table of a running server.
# These keep an old Alt+Left/Right binding from surviving a reload.
unbind -n M-Left
unbind -n M-Right

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# While a project is dragged it is drawn as a ghost; the swap happens on drop.
bind -n MouseDrag1Status set -g @wd_drag 1 \; refresh-client -S
bind -n MouseDragEnd1Status set -gu @wd_drag \; refresh-client -S \; run-shell -b "work _drop '#{client_name}' '#{window_id}'"
bind -n MouseDragEnd1StatusDefault set -gu @wd_drag \; refresh-client -S
bind -n MouseDragEnd1StatusLeft set -gu @wd_drag \; refresh-client -S
bind -n MouseDragEnd1StatusRight set -gu @wd_drag \; refresh-client -S
bind -n MouseDragEnd1Pane set -gu @wd_drag \; refresh-client -S \; send-keys -M
set -gu @wd_drag

bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Up    select-pane -t :.-
bind -n S-Down  select-pane -t :.+

bind -n M-T new-window      -c "#{pane_current_path}"
bind -n M-D split-window -h -c "#{pane_current_path}"
bind -n M-S split-window -v -c "#{pane_current_path}"
bind -n M-Z resize-pane -Z
bind -n M-X kill-pane
bind -n M-R command-prompt -I "#W" "rename-window '%%'"
bind -n M-E detach-client

# With extended-keys on, tmux sends Option+Delete in the extended format to
# programs that ask for it (Claude Code does), and they do not read it as
# "delete word". Send the plain Esc+Delete instead.
bind -n M-BSpace send-keys -H 1b 7f

# ---- with the prefix -------------------------------------------------------
unbind -a -T prefix
bind Any display-message "{{msg:tmux_unused_key}}"
bind 1 select-window -t :=1
bind 2 select-window -t :=2
bind 3 select-window -t :=3
bind 4 select-window -t :=4
bind 5 select-window -t :=5
bind 6 select-window -t :=6
bind 7 select-window -t :=7
bind 8 select-window -t :=8
bind 9 select-window -t :=9
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D
bind n next-window
bind p previous-window
bind z resize-pane -Z
bind x kill-pane
bind , command-prompt -I "#W" "rename-window '%%'"
bind d detach-client
bind Enter run-shell "work _split '#{pane_id}'"
bind v split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind = select-layout -E

set-hook -g pane-exited 'run-shell -b "sleep 0.3; work _sync"'
set-hook -g after-kill-pane 'run-shell -b "sleep 0.3; work _sync"'
bind c new-window -c "#{pane_current_path}"
bind h run-shell "work _menu '#{client_name}' '#{pane_id}'"
bind P command-prompt -p "{{msg:menu_add_prompt}}" "run-shell \"work add '%%'\""
bind A run-shell "work _agent '#{pane_id}'"
bind R run-shell -c "#{pane_current_path}" "WORKDECK_FROM_MENU=1 TMUX_PANE=#{pane_id} work review"
bind g run-shell "work _split '#{pane_id}'"
bind r source-file ~/.tmux.conf \; display-message "{{msg:tmux_reloaded}}"

set -g @wd_mod "⌘"
set -g status-interval 10
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bg=#{@wd_accent},fg=#{@wd_on_accent},bold] ❯_ #S #[default] "
set -g status-right "#[fg=#{@wd_accent}]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/$/ ·/')#[fg=#{@wd_muted}] #{?#{m:xterm-kitty,#{client_termname}},#{@wd_mod}h,ctrl+b h} menu · %H:%M "
setw -g window-status-separator ""
setw -g window-status-style "default"
setw -g window-status-current-style "default"
setw -g window-status-last-style "default"
setw -g window-status-activity-style "default"
setw -g window-status-format "#{?#{@wd_panel},#[fg=#{@wd_accent}],#[fg=#{@wd_muted}]} #I #W#{?#{@agent_stars}, #[fg=#{@wd_accent}#,bold]#{@agent_stars}#[default],} "
setw -g window-status-current-format "#{?#{&&:#{@wd_drag},#{!:#{@wd_panel}}},#[bg=#{@wd_accent}#,fg=#{@wd_on_accent}#,bold] #I #W #[default],#[fg=#{@wd_accent}#,bold] #I #{?#{@wd_panel},#[fg=#{@wd_accent}],#{?#{@wd_moved},#[fg=#{@wd_accent}],#[fg=#{@wd_text}]}}#W#{?#{@agent_stars}, #[fg=#{@wd_accent}#,bold]#{@agent_stars}#[default],} #[default]}"

set-hook -g after-split-window 'run-shell -b "work _sync"'
set-hook -g session-window-changed 'run-shell -b "work _seen #{window_id} >/dev/null 2>&1"'

# The theme is appended here by install.sh (themes/*.tmux)
# <<< workdeck <<<
