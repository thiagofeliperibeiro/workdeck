# >>> workdeck >>>
# workdeck shortcuts translated to the tmux prefix (Ctrl+b = \x02): Cmd on macOS,
# Ctrl+Shift on Linux, where install.sh rewrites the cmd+ lines.
# kitty does not manage tabs or splits: tmux does, which is why the
# session survives closing the terminal.

enabled_layouts grid

map cmd+h           send_text all \x02h
map cmd+p           send_text all \x02P
map cmd+a           send_text all \x02A
map cmd+t           send_text all \x02g
map cmd+z           send_text all \x02z
map cmd+w           send_text all \x02x
map cmd+1           send_text all \x021
map cmd+2           send_text all \x022
map cmd+3           send_text all \x023
map cmd+4           send_text all \x024
map cmd+5           send_text all \x025
map cmd+6           send_text all \x026
map cmd+7           send_text all \x027
map cmd+8           send_text all \x028
map cmd+9           send_text all \x029

macos_option_as_alt  left

# kitty does not send Shift+Enter in a format tmux reads. This sends it in
# the extended format, so agents get a new line instead of a submit. It only
# applies while tmux runs in the window; elsewhere the shell would print it.
map --when-focus-on cmdline:tmux shift+enter send_text all \x1b[13;2u

# The theme is appended here by install.sh (themes/*.conf)
# <<< workdeck <<<
